<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportStream TZ — Mechi, TV & Radio</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{--bg:#0b0e14;--panel:#151a24;--line:#232a38;--txt:#e8edf5;--mut:#8b96ab;--org:#ff7f00;--org2:#ffb84d;--red:#f85149;--grn:#238636;--blu:#1f6feb;--ease:cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,Arial,sans-serif}
body{background:var(--bg);color:var(--txt);min-height:100vh}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
header{position:sticky;top:0;z-index:70;background:linear-gradient(180deg,rgba(11,14,20,.97),rgba(11,14,20,.9));backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;animation:fadeDown .4s var(--ease)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}}
.logo{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px;animation:fadeIn .5s var(--ease)}
.logo .cone{width:26px;height:26px;filter:drop-shadow(0 2px 8px rgba(255,127,0,.4))}
.logo b{color:var(--org)}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s var(--ease)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{border-color:var(--org);color:var(--org);transform:translateY(-2px)}
.iconbtn:active{transform:scale(.92)}
.tabs{display:flex;position:sticky;top:59px;z-index:65;background:var(--bg);padding:8px 14px;gap:6px;animation:fadeDown .45s var(--ease)}
.tab{flex:1;padding:9px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line);text-align:center;cursor:pointer;font-weight:600;color:var(--mut);font-size:.82rem;display:flex;align-items:center;justify-content:center;gap:6px;transition:.25s var(--ease)}
.tab svg{width:16px;height:16px}
.tab:hover{border-color:var(--org);color:var(--txt)}
.tab.active{background:linear-gradient(135deg,var(--org),#e56b00);color:#111;border-color:var(--org);box-shadow:0 4px 16px rgba(255,127,0,.3);transform:translateY(-1px)}
.datebar,.leaguebar{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;animation:fadeIn .5s var(--ease)}
.dchip,.lchip{padding:7px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:.82rem;color:var(--mut);text-align:center;transition:.2s var(--ease)}
.dchip:hover,.lchip:hover{border-color:var(--org)}
.dchip.active{background:linear-gradient(135deg,var(--org),#e56b00);color:#111;font-weight:700;border-color:var(--org);box-shadow:0 3px 12px rgba(255,127,0,.3)}
.dchip small{display:block;font-size:.58rem}
.lchip.active{background:var(--blu);color:#fff;border-color:var(--blu);font-weight:700}
main{padding:4px 14px 90px;max-width:960px;margin:0 auto}
.search{padding:0 14px 8px;animation:fadeIn .5s var(--ease)}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:20px;border:1px solid var(--line);background:var(--panel) url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%238b96ab" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>') no-repeat 12px center;color:var(--txt);transition:.2s}
.search input:focus{outline:none;border-color:var(--org);box-shadow:0 0 0 3px rgba(255,127,0,.15)}
/* entrances */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.anim-in{animation:slideUp .45s var(--ease) both}
/* skeleton */
.skel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:9px;display:flex;gap:12px;align-items:center}
.sk{border-radius:8px;background:linear-gradient(90deg,#1c2330 25%,#28324a 50%,#1c2330 75%);background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{to{background-position:-200% 0}}
/* matches */
.lg-title{margin:14px 0 8px;font-size:.82rem;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-weight:700;display:flex;align-items:center;gap:8px}
.lg-title svg{width:15px;height:15px}
.match{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:10px;transition:.2s var(--ease)}
.match:hover{border-color:var(--org);transform:translateX(3px)}
.status{font-size:.62rem;font-weight:800;padding:4px 9px;border-radius:11px;white-space:nowrap;min-width:58px;text-align:center}
.st-live{background:var(--red);color:#fff;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.55;box-shadow:0 0 12px rgba(248,81,73,.7)}}
.st-soon{background:#9e6a03;color:#fff}.st-ft{background:#30363d;color:var(--mut)}.st-up{background:var(--blu);color:#fff}
.teams{flex:1;min-width:0}
.team{display:flex;align-items:center;gap:8px;padding:3px 0;font-weight:600;font-size:.92rem}
.logoT{width:24px;height:24px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;overflow:hidden;flex-shrink:0}
.logoT img{width:100%;height:100%;object-fit:contain}
.score{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;color:var(--org)}
.watch{background:linear-gradient(135deg,var(--grn),#1a7f37);color:#fff;border:none;padding:8px 14px;border-radius:16px;cursor:pointer;font-weight:700;font-size:.75rem;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:.2s var(--ease)}
.watch svg{width:13px;height:13px}
.watch:hover{transform:scale(1.06);box-shadow:0 4px 14px rgba(35,134,54,.4)}
.watch:active{transform:scale(.95)}
/* standings */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.82rem}
th{background:#1c222e;padding:10px 6px;text-align:left;color:var(--mut);font-size:.68rem;text-transform:uppercase;letter-spacing:.5px}
td{padding:9px 6px;border-top:1px solid var(--line)}
tr{transition:background .15s}
tr:hover td{background:rgba(255,127,0,.05)}
tr.top td{background:rgba(35,134,54,.1)}
tr.releg td{background:rgba(248,81,73,.07)}
.pos{font-weight:800;color:var(--mut);width:28px}
.pts{font-weight:800;color:var(--org);text-align:right}
.tname{display:flex;align-items:center;gap:8px;font-weight:600}
/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;position:relative;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.card:hover{transform:translateY(-4px);border-color:var(--org);box-shadow:0 10px 28px rgba(255,127,0,.15)}
.card:hover::after{transform:translateX(120%)}
.thumb{height:88px;display:flex;align-items:center;justify-content:center;color:#fff}
.thumb svg{width:34px;height:34px;opacity:.95}
.rbadge{position:absolute;bottom:6px;right:7px;background:rgba(0,0,0,.65);font-size:.58rem;padding:2px 7px;border-radius:5px;display:flex;gap:3px;align-items:center}
.rbadge svg{width:10px;height:10px}
.live{position:absolute;top:7px;left:7px;background:var(--red);font-size:.58rem;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff;display:flex;gap:4px;align-items:center;animation:pl 1.4s infinite}
.live i{width:5px;height:5px;background:#fff;border-radius:50%}
.info{padding:9px 11px}
.info h3{font-size:.88rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mut);align-items:center}
.fav,.del{background:none;border:none;cursor:pointer;padding:2px;color:var(--mut);transition:.15s}
.fav svg,.del svg{width:15px;height:15px}
.fav:hover,.fav.on{color:var(--red);transform:scale(1.2)}
.del:hover{color:var(--red)}
/* modals */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal .box,.modal .pshell{animation:popIn .3s var(--ease)}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(12px)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;padding:20px;max-height:85vh;overflow-y:auto}
.box h3{color:var(--org);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.box h3 svg{width:18px;height:18px}
.box input,.box select{width:100%;padding:10px 12px;margin:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt);transition:.2s}
.box input:focus{outline:none;border-color:var(--org)}
.box p{font-size:.8rem;color:var(--mut);margin:8px 0;line-height:1.5}.box a{color:var(--org)}
.result-item{display:flex;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:9px;margin:5px 0;cursor:pointer;font-size:.85rem;transition:.15s}
.result-item:hover{border-color:var(--org);background:rgba(255,127,0,.06)}
.btn{padding:10px 18px;border:none;border-radius:18px;background:linear-gradient(135deg,var(--org),#e56b00);color:#111;font-weight:700;cursor:pointer;margin-top:8px;transition:.2s var(--ease);box-shadow:0 3px 12px rgba(255,127,0,.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,127,0,.4)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.blu{background:var(--blu);color:#fff;box-shadow:0 3px 12px rgba(31,111,235,.3)}
.ch-item{display:flex;align-items:center;gap:12px;padding:11px;border:1px solid var(--line);border-radius:11px;margin:6px 0;cursor:pointer;transition:.15s}
.ch-item:hover{border-color:var(--org);transform:translateX(3px)}
.ch-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.ch-ic svg{width:19px;height:19px}
/* player */
.pshell{background:#10131a;border:1px solid var(--line);border-radius:14px;width:100%;max-width:840px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.7)}
.titlebar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#1a1f2b,#12161f);padding:8px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:.88rem}
.x{background:var(--red);border:none;color:#fff;width:30px;height:26px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.x svg{width:13px;height:13px}
.x:hover{filter:brightness(1.2)}
.screen{position:relative;background:#000;aspect-ratio:16/9}
video{width:100%;height:100%;display:block}
.spin2{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--org);font-size:.8rem}
.spinner{width:44px;height:44px;border:4px solid #222;border-top-color:var(--org);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.errbox{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:rgba(0,0,0,.92);color:#ff9c9c;font-size:.82rem;text-align:center;padding:16px}
.errbox svg{width:34px;height:34px;color:var(--red)}
.ctl{background:linear-gradient(180deg,#171c27,#11141c);padding:8px 12px 10px;border-top:1px solid var(--line)}
.tl{height:6px;background:#2a3242;border-radius:3px;cursor:pointer;position:relative;margin-bottom:9px;transition:height .15s}
.tl:hover{height:9px}
.tl .prog{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--org),var(--org2));border-radius:3px;box-shadow:0 0 8px rgba(255,127,0,.5)}
.tl .prog::after{content:"";position:absolute;right:-6px;top:50%;width:13px;height:13px;background:var(--org);border-radius:50%;transform:translateY(-50%);opacity:0;transition:.15s}
.tl:hover .prog::after{opacity:1}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cb{background:#222a38;border:1px solid var(--line);color:#fff;min-width:34px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.cb svg{width:15px;height:15px}
.cb:hover{background:var(--org);color:#111;border-color:var(--org)}
.cb.big{background:linear-gradient(135deg,var(--org),#e56b00);color:#111;min-width:44px;height:38px;font-size:1rem;border:none}
.cb.big:hover{transform:scale(1.08)}
.time2{font-size:.72rem;color:var(--mut)}.spacer{flex:1}
.vol{display:flex;align-items:center;gap:6px}
.vol svg{width:16px;height:16px}
.vol input{width:72px;accent-color:var(--org);cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:44px 18px;line-height:1.8}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:linear-gradient(135deg,var(--org),#e56b00);color:#111;padding:10px 20px;border-radius:22px;font-weight:700;z-index:300;transition:transform .35s var(--ease);box-shadow:0 6px 20px rgba(255,127,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;display:none;animation:popIn .3s var(--ease)}
.form.open{display:block}.form h3{color:var(--org);margin-bottom:6px}
.form input,.form select{width:100%;padding:9px 12px;margin:5px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}
@media(max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}.thumb{height:74px}td:nth-child(4),td:nth-child(5){display:none}th:nth-child(4),th:nth-child(5){display:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><svg class="cone" viewBox="0 0 24 24" stroke="none"><path d="M12 2 2 20h20L12 2z" fill="#ff7f00"/><path d="M12 2 7.5 20h3L14 2h-2z" fill="#fff"/><rect x="4" y="20" width="16" height="2" rx="1" fill="#e6e6e6"/></svg>Sport<b>Stream</b></div>
  <div style="flex:1"></div>
  <button class="iconbtn" onclick="toggleForm()" title="Ongeza channel"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="iconbtn" onclick="openSettings()" title="API"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  <button class="iconbtn" onclick="refresh()" title="Refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>
</header>

<div class="tabs">
  <div class="tab active" data-t="mechi" onclick="setTab('mechi')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 3"/></svg>MECHI</div>
  <div class="tab" data-t="meza" onclick="setTab('meza')"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15v-4M12 17V7M17 13v-6"/></svg>MEZA</div>
  <div class="tab" data-t="tv" onclick="setTab('tv')"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="m17 2-5 5-5-5"/></svg>TV</div>
  <div class="tab" data-t="radio" onclick="setTab('radio')"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><circle cx="8.5" cy="14.5" r="2.5"/><path d="M17 11h.01M17 15h.01"/></svg>RADIO</div>
</div>

<div id="mechiUI">
  <div class="search"><input id="q" placeholder="Tafuta team au channel..."></div>
  <div class="datebar" id="datebar"></div>
  <div class="leaguebar" id="leaguebar"></div>
</div>

<main>
  <div class="form" id="form">
    <h3>Ongeza Channel / Radio</h3>
    <input id="fName" type="text" placeholder="Jina la channel">
    <input id="fUrl" type="text" placeholder="URL ya stream (.m3u8 / .mp3 / YouTube)">
    <div class="frow">
      <select id="fType"><option value="tv">TV (Video)</option><option value="radio">Radio (Audio)</option><option value="yt">YouTube</option></select>
      <select id="fCat"><option>Habari</option><option>Mpira</option><option>Burudani</option><option>Movie</option><option>Watoto</option><option>Dini</option><option>Muziki</option><option>Redio</option></select>
    </div>
    <div class="frow">
      <input id="fEmoji" type="text" placeholder="Emoji (hiari)" maxlength="4">
      <input id="fColor" type="text" placeholder="Rangi (mf. #ff7f00)" value="#1f6feb">
    </div>
    <button class="btn" onclick="addCh()">Hifadhi</button>
  </div>

  <div id="loading" style="display:none"></div>
  <div id="content"></div>
</main>

<!-- SETTINGS -->
<div class="modal" id="setModal"><div class="box">
  <h3><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Mipangilio — API Key</h3>
  <p>Chukua bure: <a href="https://dashboard.api-football.com/register" target="_blank">dashboard.api-football.com</a> → Free plan → copy key.</p>
  <input id="apiKey" type="password" placeholder="API key...">
  <button class="btn blu" onclick="saveKey()">Hifadhi</button>
  <hr>
  <h3><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Tafuta Ligi</h3>
  <input id="lgSearch" placeholder="mf. Tanzania, Champions..." oninput="searchLeagues()">
  <div id="lgResults"></div>
  <button class="btn ghost" onclick="closeSettings()">Funga</button>
</div></div>

<!-- CHANNEL PICKER -->
<div class="modal" id="chModal"><div class="box">
  <h3><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="m17 2-5 5-5-5"/></svg>Chagua channel ya mechi</h3>
  <div id="chList"></div>
  <p>Au weka link moja kwa moja:</p>
  <input id="mLink" type="text" placeholder="https://... (FIFA+, YouTube rasmi)">
  <button class="btn blu" onclick="saveMatchLink()">Hifadhi & Cheza</button>
  <button class="btn ghost" onclick="closeCh()">Funga</button>
</div></div>

<!-- PLAYER -->
<div class="modal" id="pModal"><div class="pshell">

    <div class="spin2" id="spin"><div class="spinner"></div><div>Inapakia stream...</div></div>
    <div class="errbox" id="errbox"><svg viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3M12 9v4M12 17h.01"/></svg><b id="errMsg">Stream haifanyi kazi</b><span>Labda imekufa — jaribu channel nyingine.</span></div>
  </div>

      <button class="cb big" id="playBtn" onclick="togglePlay()"><svg viewBox="0 0 24 24" id="playIco"><path d="M6 4l14 8-14 8z" fill="currentColor" stroke="none"/></svg></button>
      <button class="cb" onclick="skip(-10)"><svg viewBox="0 0 24 24"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
      <button class="cb" onclick="skip(10)"><svg viewBox="0 0 24 24"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>

      <button class="cb" onclick="fullScr()"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>

<script>
const I={
 tv:'<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="m17 2-5 5-5-5"/></svg>',
 radio:'<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><circle cx="8.5" cy="14.5" r="2.5"/><path d="M17 11h.01M17 15h.01"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.3 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.2 1.5 4 3 5.5l7 7z"/></svg>',
 heartF:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor"><path d="M19 14c1.5-1.5 3-3.3 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.2 1.5 4 3 5.5l7 7z"/></svg>',
 trash:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="currentColor" stroke="none"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor" stroke="none"/></svg>',
 link:'<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
 trophy:'<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a1 1 0 0 0-1 1 4 4 0 0 0 4 4M17 6h3a1 1 0 0 1 1 1 4 4 0 0 1-4 4"/></svg>',
 ball:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 3"/></svg>',
 grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
 info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
};

/* ============ STATE ============ */
const BASE="https://v3.football.api-sports.io";
let KEY=localStorage.getItem("mc_key")||"f9181a213b26df8311d35e596a001b56";
let league=JSON.parse(localStorage.getItem("mc_league")||"null")||{id:2,name:"Champions League"};
let tab="mechi";
let selDate=new Date();selDate.setHours(0,0,0,0);
let matchLinks=JSON.parse(localStorage.getItem("m_links")||"{}");
let favs=new Set(JSON.parse(localStorage.getItem("ss_favs")||"[]"));
let activeCat="Zote", editMode=false, curMatch=null, hls=null;

const DEFCH=[
 {name:"Al Jazeera English",cat:"Habari",type:"tv",url:"https://live-hls-web-aje.getaj.net/AJE/index.m3u8",emoji:"",color:"#e8912d",live:true},
 {name:"DW English",cat:"Habari",type:"tv",url:"https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8",emoji:"",color:"#002d5c",live:true},
 {name:"France 24 English",cat:"Habari",type:"tv",url:"https://static.france24.com/live/F24_EN_HI_HLS/live_web.m3u8",emoji:"",color:"#0a3d91",live:true},
 {name:"NASA TV",cat:"Burudani",type:"tv",url:"https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",emoji:"",color:"#0b3d91",live:true},
 {name:"Red Bull TV",cat:"Burudani",type:"tv",url:"https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",emoji:"",color:"#d10e00",live:true},
 {name:"FIFA+ (YouTube)",cat:"Mpira",type:"yt",url:"https://www.youtube.com/@FIFA",emoji:"",color:"#0b6e4f",live:false},
 {name:"CAF TV (YouTube)",cat:"Mpira",type:"yt",url:"https://www.youtube.com/@CAFTV",emoji:"",color:"#1f6feb",live:false},
 {name:"BBC World Service",cat:"Redio",type:"radio",url:"http://stream.live.vc.bbcmedia.co.uk/bbc_world_service",emoji:"",color:"#b80000",live:true},
];
let channels=JSON.parse(localStorage.getItem("ss_ch")||"null")||DEFCH;
const save=()=>{localStorage.setItem("ss_ch",JSON.stringify(channels));localStorage.setItem("ss_favs",JSON.stringify([...favs]));localStorage.setItem("m_links",JSON.stringify(matchLinks));};
const $=id=>document.getElementById(id);
const QUICK=[{id:2,name:"Champions League"},{id:39,name:"Premier League"},{id:140,name:"La Liga"},{id:135,name:"Serie A"},{id:78,name:"Bundesliga"},{id:61,name:"Ligue 1"},{id:1,name:"World Cup"}];
const CATS=["Zote","Habari","Mpira","Burudani","Movie","Watoto","Dini","Muziki","Redio","♥ Favorites"];
const chIcon=c=>c.emoji?`<span style="font-size:1.6rem">${c.emoji}</span>`:I[c.type==="radio"?"radio":"tv"];

/* ============ NAV ============ */
function setTab(t){tab=t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.t===t));
 $("mechiUI").style.display=(t==="mechi"||t==="meza")?"block":"none";
 if(t==="meza")loadStandings();else if(t==="mechi")load();else renderChannels();}

/* ============ API ============ */
async function api(path){const ck="c"+path;const c=sessionStorage.getItem(ck);if(c)return JSON.parse(c);
 const r=await fetch(BASE+path,{headers:{"x-apisports-key":KEY}});
 if(r.status===401){toast("Key si sahihi — ⚙️");return null;}
 if(!r.ok)return null;const j=await r.json();sessionStorage.setItem(ck,JSON.stringify(j));return j;}

function renderDates(){let h="";const t=new Date();t.setHours(0,0,0,0);
 for(let i=-3;i<5;i++){const d=new Date(t.getTime()+i*86400000);
  h+=`<div class="dchip ${d.getTime()===selDate.getTime()?'active':''}" onclick="setDate(${d.getTime()})">${d.getDate()}/${d.getMonth()+1}<small>${d.toDateString()===t.toDateString()?"Leo":d.toLocaleDateString("sw",{weekday:"short"})}</small></div>`;}
 $("datebar").innerHTML=h;}
function setDate(t){selDate=new Date(t);renderDates();load();}
function renderLeagueBar(){const items=[...QUICK.filter(q=>q.id!==league.id),league];
 $("leaguebar").innerHTML=items.map(l=>`<div class="lchip ${l.id===league.id?'active':''}" onclick='saveLeague(${JSON.stringify(l)})'>${l.name}</div>`).join("");}
function saveLeague(l){league=l;localStorage.setItem("mc_league",JSON.stringify(l));renderLeagueBar();if(tab==="mechi")load();else loadStandings();}

/* ============ SKELETON ============ */
function skeleton(n=5){return Array(n).fill(`<div class="skel"><div class="sk" style="width:58px;height:22px"></div><div style="flex:1"><div class="sk" style="height:14px;width:70%;margin-bottom:6px"></div><div class="sk" style="height:14px;width:50%"></div></div></div>`).join("");}
function skelGrid(n=8){return `<div class="grid">${Array(n).fill(`<div class="card"><div class="thumb sk"></div><div class="info"><div class="sk" style="height:12px;width:80%;margin-bottom:6px"></div><div class="sk" style="height:10px;width:50%"></div></div></div>`).join("")}</div>`;}

/* ============ MECHI ============ */
function countDown(t){const d=t-Date.now();if(d<=0)return"ANZA";const h=Math.floor(d/3600000),m=Math.floor(d%3600000/60000);return h>0?`Inasalia ${h}h ${m}m`:`Inasalia ${m}dak`;}
function stMap(s){const M={"1H":["st-live","1st Half"],"HT":["st-soon","MAPUMZIKO"],"2H":["st-live","2nd Half"],"ET":["st-live","ET"],"P":["st-live","PEN"],"FT":["st-ft","FT"],"AET":["st-ft","FT (ET)"],"PEN":["st-ft","FT (P)"],"POST":["st-ft","ILIHARIBIKA"],"CANC":["st-ft","IMEFUTWA"],"ABD":["st-ft","IMEACHWA"],"SUSP":["st-soon","IMESIMAMA"],"INT":["st-soon","MAPUMZIKO"],"AWARDED":["st-ft","UAMUZI"]};
 if(s.short==="NS")return null;const m=M[s.short]||["st-soon",s.short];return{cls:m[0],txt:s.elapsed?`${s.elapsed}'`:m[1]};}
function tLogo(t){return t.logo?`<img src="${t.logo}" onerror="this.parentElement.textContent='${t.name[0]}'">`:t.name[0];}

async function load(){
 if(!KEY){$("content").innerHTML=`<div class="empty">${I.info}<br>Weka API key (bonyeza ⚙️ juu) kuona mechi halisi.</div>`;return;}
 $("content").innerHTML=skeleton(6);
 const season=new Date().getFullYear(),ds=selDate.toISOString().slice(0,10);
 let liveData=[];
 const t=new Date();t.setHours(0,0,0,0);
 if(selDate.getTime()===t.getTime()){const lv=await api(`/fixtures?live=all&league=${league.id}`);if(lv&&lv.response)liveData=lv.response;}
 const fx=await api(`/fixtures?league=${league.id}&season=${season}&date=${ds}`);
 let ms=fx&&fx.response?fx.response:[];
 ms=ms.map(m=>liveData.find(x=>x.fixture.id===m.fixture.id)||m);
 liveData.forEach(l=>{if(!ms.find(m=>m.fixture.id===l.fixture.id))ms.push(l);});
 if(!ms.length){$("content").innerHTML=`<div class="empty">${I.ball}<br>Hakuna mechi ya <b>${league.name}</b> siku hii.<br>⚙️ → tafuta ligi nyingine kwa jina.</div>`;return;}
 ms.sort((a,b)=>a.fixture.timestamp-b.fixture.timestamp);renderMatches(ms);
}
function renderMatches(ms){
 const q=$("q").value.toLowerCase();let html="",i=0;
 ms.filter(m=>m.teams.home.name.toLowerCase().includes(q)||m.teams.away.name.toLowerCase().includes(q)).forEach(m=>{
  const st=m.fixture.status;let badge;
  if(st.short==="NS"){const cd=countDown(m.fixture.timestamp);badge=`<div class="status ${cd==="ANZA"?'st-soon':'st-up'}" style="min-width:104px">${cd}</div>`;}
  else{const s=stMap(st);badge=s?`<div class="status ${s.cls}">${s.txt}</div>`:`<div class="status st-ft">${st.short}</div>`;}
  const link=matchLinks[m.fixture.id];
  html+=`<div class="match anim-in" style="animation-delay:${i++*45}ms">${badge}<div class="teams">
   <div class="team"><div class="logoT">${tLogo(m.teams.home)}</div>${m.teams.home.name}${st.short!=="NS"?`<span class="score">${m.goals.home??"-"}</span>`:""}</div>
   <div class="team"><div class="logoT">${tLogo(m.teams.away)}</div>${m.teams.away.name}${st.short!=="NS"?`<span class="score">${m.goals.away??"-"}</span>`:""}</div></div>
   <button class="watch" onclick="angalia(${m.fixture.id})">${I.tv}${link?"ANGALIA":"WEKA"}</button></div>`;
 });
 $("content").innerHTML=`<div class="lg-title anim-in">${I.trophy}${league.name} — ${selDate.getDate()}/${selDate.getMonth()+1}/${selDate.getFullYear()}</div>`+(html||`<div class="empty">${I.ball}<br>Hakuna mechi inayolingana.</div>`);
}
function angalia(id){
 curMatch=id;
 if(matchLinks[id]){playUrl(matchLinks[id],"Mechi LIVE");return;}
 const list=channels.filter(c=>c.url&&c.type==="tv");
 $("chList").innerHTML=list.length?list.map((c,i)=>`<div class="ch-item anim-in" style="animation-delay:${i*40}ms" onclick="pickCh(${i})"><div class="ch-ic" style="background:${c.color}">${chIcon(c)}</div><div><b>${c.name}</b><div style="font-size:.7rem;color:var(--mut)">${c.cat}</div></div></div>`).join(""):`<p style="color:var(--mut);font-size:.85rem">Hakuna channel na URL — ongeza kwa ＋ juu.</p>`;
 $("chModal").classList.add("open");
}
function pickCh(i){const c=channels.filter(x=>x.url&&x.type==="tv")[i];
 if(c.type==="yt"){window.open(c.url,"_blank");closeCh();return;}
 matchLinks[curMatch]=c.url;save();closeCh();playUrl(c.url,c.name);if(tab==="mechi")load();}
function saveMatchLink(){const u=$("mLink").value.trim();if(!u)return;matchLinks[curMatch]=u;save();closeCh();playUrl(u,"Mechi LIVE");if(tab==="mechi")load();}
function closeCh(){$("chModal").classList.remove("open");$("mLink").value="";}

/* ============ MEZA ============ */
async function loadStandings(){
 if(!KEY){$("content").innerHTML=`<div class="empty">${I.info}<br>Weka API key kwanza (⚙️).</div>`;return;}
 $("content").innerHTML=skeleton(8);
 const j=await api(`/standings?league=${league.id}&season=${new Date().getFullYear()}`);
 if(!j||!j.response||!j.response.length||!j.response[0].league.standings.length){$("content").innerHTML=`<div class="empty">${I.info}<br>Hakuna meza ya <b>${league.name}</b> kwa msimu huu.</div>`;return;}
 const rows=j.response[0].league.standings[0];
 const n=rows.length;
 $("content").innerHTML=`<div class="lg-title anim-in">${I.trophy}Meza ya ${league.name} — ${new Date().getFullYear()}/${String(new Date().getFullYear()+1).slice(2)}</div>
 <div class="anim-in" style="overflow-x:auto"><table><tr><th>#</th><th>Team</th><th>Mc</th><th>U</th><th>S</th><th>T</th><th>+-</th><th style="text-align:right">Alama</th></tr>
 ${rows.map((r,i)=>`<tr class="${i<4?'top':(i>=n-3?'releg':'')}">
  <td class="pos">${r.rank}</td>
  <td><div class="tname"><div class="logoT">${r.team.logo?`<img src="${r.team.logo}" onerror="this.parentElement.textContent='${r.team.name[0]}'">`:r.team.name[0]}</div>${r.team.name}${r.description?` <span style="font-size:.6rem;color:var(--mut)">(${r.description})</span>`:""}</div></td>
  <td>${r.all.played}</td><td>${r.all.win}</td><td>${r.all.draw}</td><td>${r.all.lose}</td>
  <td>${r.goalsDiff>0?"+"+r.goalsDiff:r.goalsDiff}</td><td class="pts">${r.points}</td></tr>`).join("")}</table></div>`;
}

/* ============ TV / RADIO ============ */
function renderChannels(){
 const q=($("q").value||"").toLowerCase();
 const type=tab==="radio"?"radio":"tv";
 let list=channels.filter(c=>type==="radio"?c.type==="radio":c.type!=="radio");
 if(activeCat!=="Zote"&&activeCat!=="♥ Favorites")list=list.filter(c=>c.cat===activeCat);
 if(activeCat==="♥ Favorites")list=list.filter(c=>favs.has(c.name));
 list=list.filter(c=>c.name.toLowerCase().includes(q));
 const catBar=type==="radio"?"":`<div class="datebar">${CATS.map(c=>`<div class="dchip ${c===activeCat?'active':''}" style="min-width:auto" onclick="setCat('${c}')">${c}</div>`).join("")}</div>`;
 $("content").innerHTML=catBar+(list.length?`<div class="grid">${list.map((c,idx)=>{const i=channels.indexOf(c);return `
  <div class="card anim-in" style="animation-delay:${idx*45}ms" onclick="playCh(${i})">${c.live?'<div class="live"><i></i>LIVE</div>':""}
   <div class="thumb" style="background:linear-gradient(135deg,${c.color},#0009)">${chIcon(c)}${c.type==="radio"?`<span class="rbadge">${I.radio}RADIO</span>`:""}</div>
   <div class="info"><h3>${c.name}</h3><div class="meta"><span>${c.cat}</span><span>
    <button class="fav ${favs.has(c.name)?'on':''}" onclick="event.stopPropagation();tfav('${c.name.replace(/'/g,"\\'")}')">${favs.has(c.name)?I.heartF:I.heart}</button>
    ${editMode?`<button class="del" onclick="event.stopPropagation();delCh(${i})">${I.trash}</button>`:""}</span></div></div></div>`}).join("")}</div>`
  :`<div class="empty">${I.grid}<br>Hakuna channel — ongeza kwa ＋ juu.</div>`);
}
function setCat(c){activeCat=c;renderChannels();}
function tfav(n){favs.has(n)?favs.delete(n):favs.add(n);save();renderChannels();}
function delCh(i){if(confirm("Futa "+channels[i].name+"?")){channels.splice(i,1);save();renderChannels();}}
function playCh(i){const c=channels[i];
 if(c.type==="yt"){window.open(c.url,"_blank");return;}
 if(c.type==="radio"){playRadio(c);return;}
 if(!c.url){toast("Channel haina URL");return;}
 playUrl(c.url,c.name);}

/* ============ PLAYER ============ */
const vid=$("vid");
function playUrl(url,title){
 $("pTitle").textContent=title;$("pModal").classList.add("open");
 $("spin").style.display="flex";$("errbox").style.display="none";$("ctlbar").style.display="block";vid.style.display="block";
 if(hls){hls.destroy();hls=null;}vid.pause();vid.removeAttribute("src");vid.load();
 if(url.includes(".m3u8")&&window.Hls&&Hls.isSupported()){
  hls=new Hls();hls.loadSource(url);hls.attachMedia(vid);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>vid.play().catch(()=>{}));
  hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)showErr("Stream haifanyi kazi — jaribu nyingine.");});
 }else if(url.includes(".m3u8")&&vid.canPlayType("application/vnd.apple.mpegurl")){
  vid.src=url;vid.play().catch(()=>showErr("Stream haifanyi (Safari)."));
 }else{vid.src=url;vid.play().catch(()=>showErr("Stream haifanyi kazi."));}
 vid.onplaying=()=>{$("spin").style.display="none";$("playBtn").innerHTML=I.pause;};
 vid.onwaiting=()=>{$("spin").style.display="flex";};
 vid.onpause=()=>{$("playBtn").innerHTML=I.play;};
 vid.ontimeupdate=()=>{const p=(vid.currentTime/(vid.duration||1))*100;$("prog").style.width=p+"%";$("tCur").textContent=fmt(vid.currentTime);};
}
function playRadio(c){
 $("pTitle").textContent=c.name;$("pModal").classList.add("open");
 $("ctlbar").style.display="none";vid.style.display="none";
 $("screen").insertAdjacentHTML("beforeend",`<audio id="aud" autoplay style="width:100%;margin-top:calc(50% - 30px)"></audio>`);
 const a=$("aud");a.src=c.url;
 a.onplaying=()=>{$("spin").style.display="none";toast(c.name+" inacheza");};
 a.onerror=()=>showErr("Radio haifanyi kazi.");
}
function showErr(m){$("spin").style.display="none";$("errbox").style.display="flex";$("errMsg").textContent=m;}
function closeP(){$("pModal").classList.remove("open");if(hls){hls.destroy();hls=null;}vid.pause();vid.removeAttribute("src");vid.load();const a=$("aud");if(a){a.pause();a.remove();}}
function togglePlay(){vid.paused?(vid.play(),$("playBtn").innerHTML=I.pause):(vid.pause(),$("playBtn").innerHTML=I.play);}
function skip(s){if(vid.seekable.length)vid.currentTime=Math.max(0,Math.min(vid.duration||0,vid.currentTime+s));}
function fullScr(){const s=$("screen");document.fullscreenElement?document.exitFullscreen():s.requestFullscreen&&s.requestFullscreen();}
function fmt(s){if(!isFinite(s))return"00:00";const m=Math.floor(s/60),ss=Math.floor(s%60);return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}
$("tl").onclick=e=>{const r=$("tl").getBoundingClientRect();if(vid.seekable.length)vid.currentTime=((e.clientX-r.left)/r.width)*vid.duration;};

/* ============ SETTINGS / FORM ============ */
function openSettings(){$("setModal").classList.add("open");$("apiKey").value=KEY;}
function closeSettings(){$("setModal").classList.remove("open");}
function saveKey(){KEY=$("apiKey").value.trim();localStorage.setItem("mc_key",KEY);toast(KEY?"Key imewekwa":"Key imeondolewa");if(KEY){closeSettings();tab==="meza"?loadStandings():load();}}
async function searchLeagues(){const q=$("lgSearch").value.trim();if(q.length<2||!KEY){$("lgResults").innerHTML="";return;}
 const j=await api(`/leagues?search=${encodeURIComponent(q)}`);
 if(!j||!j.response){$("lgResults").innerHTML="<p style='color:var(--mut);font-size:.8rem'>Hakuna matokeo.</p>";return;}
 $("lgResults").innerHTML=j.response.slice(0,10).map(r=>`<div class="result-item" onclick='pickLg(${JSON.stringify({id:r.league.id,name:r.league.name})})'><span>${r.league.name} <span style="font-size:.65rem;color:var(--mut)">${r.country.name}</span></span><span>✓</span></div>`).join("");}
function pickLg(l){saveLeague(l);closeSettings();toast(l.name);}
function toggleForm(){$("form").classList.toggle("open");}
function addCh(){const n=fName.value.trim(),u=fUrl.value.trim();if(!n){alert("Jina lazima");return;}
 channels.push({name:n,url:u,cat:fCat.value,type:fType.value,emoji:fEmoji.value,color:fColor.value||"#1f6feb",live:!!u});
 save();toggleForm();renderChannels();toast(n+" imeongezwa");fName.value=fUrl.value=fEmoji.value="";fColor.value="#1f6feb";}
function refresh(){sessionStorage.clear();toast("Inapakia...");tab==="meza"?loadStandings():tab==="mechi"?load():renderChannels();}
$("q").addEventListener("input",()=>{tab==="mechi"?load():(tab==="tv"||tab==="radio")&&renderChannels();});
setInterval(()=>{if(KEY&&tab==="mechi")load();},900000);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}

renderDates();renderLeagueBar();load();
</script>
